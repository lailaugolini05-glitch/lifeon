<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOn</title>
<meta name="description" content="Phone down. Life on. Focus, move and earn rewards from local shops.">
<meta name="theme-color" content="#0E2B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LifeOn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>

/* Layout: one phone-width column, bottom tab bar; Focus, "I'm bored" and dialogs open as full-screen flows. Home adapts to the chosen profile. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#F5F7F5; --ink:#13201C; --muted:#5B6B65; --line:#DCE3DF;
  --accent:#EE5A2F; --accent-ink:#FFFFFF; --teal:#0F6B5E; --teal-ink:#FFFFFF; --teal-soft:#DDEFEA;
  --night:#0E2B26; --night-ink:#EAF4F1; --plum:#5B3F8C; --plum-ink:#FFFFFF;
  --sun:#E9A21F; --good:#1F8A5B; --warn:#B7791F; --bad:#C2412D; --sport:#2563C9; --sport-ink:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:18px; --shadow:0 1px 2px rgba(19,32,28,.06), 0 8px 24px rgba(19,32,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1110; --surface:#151E1C; --sunk:#111917; --ink:#E8EFEC; --muted:#98A9A3; --line:#25322F;
  --accent:#FF6B3F; --accent-ink:#1A0C06; --teal:#2FA894; --teal-ink:#06110F; --teal-soft:#16332D;
  --night:#08201C; --night-ink:#E3F1ED; --plum:#9C82D6; --plum-ink:#140A26;
  --sun:#F2B640; --good:#47B884; --warn:#E0A64A; --bad:#F07560; --sport:#6A9BF0; --sport-ink:#06101F; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1110; --surface:#151E1C; --sunk:#111917; --ink:#E8EFEC; --muted:#98A9A3; --line:#25322F;
  --accent:#FF6B3F; --accent-ink:#1A0C06; --teal:#2FA894; --teal-ink:#06110F; --teal-soft:#16332D;
  --night:#08201C; --night-ink:#E3F1ED; --plum:#9C82D6; --plum-ink:#140A26;
  --sun:#F2B640; --good:#47B884; --warn:#E0A64A; --bad:#F07560; --sport:#6A9BF0; --sport-ink:#06101F; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:700px){body{padding-block:24px}.app{border-radius:28px;box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.12);overflow:hidden}}
main{flex:1;padding-block:8px 104px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);position:relative;flex:none}
.brand .dot::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;background:var(--accent-ink)}
.brand b{color:var(--accent)}
.where{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.banner{font-size:13px;background:var(--teal-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.banner.warn{background:color-mix(in srgb, var(--sun) 22%, transparent)}
.banner.bad{background:color-mix(in srgb, var(--bad) 14%, transparent)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb, var(--accent) 55%, transparent);outline-offset:2px}
button.ghost{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
button.teal{background:var(--teal);color:var(--teal-ink)}
button.small{padding:8px 12px;font-size:13px}
button.full{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
a.link{color:var(--accent);font-weight:700;text-decoration:none}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:var(--teal-soft);color:var(--teal);box-shadow:none}
.chip.hot{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);box-shadow:none}
.chip.pro{background:var(--plum);color:var(--plum-ink);box-shadow:none}
.chip.ex{background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--line)}
button.chip{cursor:pointer;padding:8px 12px;font-size:13px}
button.chip[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);box-shadow:none}
.hero{background:var(--teal);color:var(--teal-ink);border-radius:22px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;box-shadow:var(--shadow)}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .pts{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .pts small{font-size:16px;font-weight:700;margin-left:4px;opacity:.85}
.hero .sub{font-size:13px;opacity:.9}
.hero .next{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hero .bar{height:8px;border-radius:99px;background:color-mix(in srgb, var(--teal-ink) 22%, transparent);overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--teal-ink);border-radius:99px}
.streak{display:flex;flex-direction:column;align-items:center;gap:2px;background:color-mix(in srgb, var(--teal-ink) 12%, transparent);border-radius:16px;padding:10px 12px;min-width:80px}
.streak .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.streak .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.bigbtn{width:100%;border-radius:22px;padding:18px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;box-shadow:var(--shadow)}
.bigbtn .bi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb, currentColor 16%, transparent)}
.bigbtn .bi svg{width:28px;height:28px}
.bigbtn .bt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;display:block}
.bigbtn .bs{font-size:13px;font-weight:600;opacity:.88;margin-top:3px;display:block}
.bigbtn.focus{background:var(--night);color:var(--night-ink)}
.bigbtn.bored{background:var(--accent);color:var(--accent-ink)}
.bigbtn.soft{background:var(--surface);color:var(--ink);padding:14px 16px}
.bigbtn.soft .bt{font-size:17px}
.bigbtn.soft .bi{width:44px;height:44px;color:var(--teal);background:var(--teal-soft)}
.bigbtn .go{font-size:22px;opacity:.8}
.stat{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column}
.list > *{padding-block:12px;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:0}
.list > *:last-child{padding-bottom:0}
.offer{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-width:0}
.offer.two{grid-template-columns:44px 1fr}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--teal);flex:none}
.ico svg{width:22px;height:22px}
.offer .t{font-weight:700;line-height:1.25}
.offer .b{font-size:13px;color:var(--muted)}
.cost{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.lb{display:grid;grid-template-columns:22px 32px 1fr auto;gap:10px;align-items:center}
.lb .rk{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.lb img,.ava{width:32px;height:32px;border-radius:50%;flex:none}
.lb .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lb.me .nm{color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--teal)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb, var(--teal) 25%, transparent)}
.coupon{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.08em}
.qr{width:120px;height:120px;background:#fff;padding:6px;border-radius:10px;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.used{opacity:.55}
.empty{text-align:center;padding:16px 8px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px;box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto}
.seg button{flex:1;background:transparent;color:var(--muted);padding:8px 8px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:10px}
.task.done span{text-decoration:line-through;color:var(--muted)}
.lock{border:1px dashed var(--plum);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb, var(--plum) 7%, transparent)}
.lock h3{display:flex;align-items:center;gap:8px}
.lock svg{width:16px;height:16px;color:var(--plum)}
.plan{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.plan.pro{background:var(--plum);color:var(--plum-ink)}
.plan .price{font-family:var(--display);font-weight:800;font-size:28px}
.plan ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabs .in{max-width:460px;margin:0 auto;display:flex;justify-content:space-around}
@media (min-width:700px){nav.tabs{position:sticky;bottom:0}}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;min-width:0}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.flow{position:fixed;inset:0;z-index:20;overflow:auto;display:flex;justify-content:center;background:var(--bg);color:var(--ink)}
.flow.night{background:var(--night);color:var(--night-ink)}
.flow > .in{width:100%;max-width:460px;padding-block:calc(18px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px}
.flow.night .card{background:color-mix(in srgb, var(--night-ink) 8%, transparent);box-shadow:none;color:var(--night-ink)}
.flow.night .muted{color:color-mix(in srgb, var(--night-ink) 70%, transparent)}
.flow.night label{color:color-mix(in srgb, var(--night-ink) 75%, transparent)}
.flow.night button.chip{background:color-mix(in srgb, var(--night-ink) 10%, transparent);color:var(--night-ink);box-shadow:none}
.flow.night button.chip[aria-pressed="true"]{background:var(--night-ink);color:var(--night)}
.flow.night input,.flow.night select{background:color-mix(in srgb, var(--night-ink) 10%, transparent);color:var(--night-ink);border-color:transparent}
.flow.night select option{color:#13201C}
.flow.night button.ghost{background:color-mix(in srgb, var(--night-ink) 12%, transparent);color:var(--night-ink);box-shadow:none}
.timer{display:grid;place-items:center;margin:8px auto}
.timer svg{width:260px;height:260px;max-width:100%;grid-area:1/1}
.timer .t{grid-area:1/1;font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.timer .t small{display:block;font-family:var(--body);font-size:13px;font-weight:700;opacity:.75;letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.blocked{display:flex;flex-wrap:wrap;gap:8px}
.blocked span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px;background:color-mix(in srgb, var(--night-ink) 10%, transparent)}
.blocked span svg{width:14px;height:14px}
.opt{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.opt .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.welcome{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.welcome h1{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.welcome h1 span{color:var(--accent)}
.pick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.pick .ico{background:var(--teal-soft)}
.pick b{font-family:var(--display);font-size:18px;display:block}
.pick span.s{font-size:13px;color:var(--muted);font-weight:500;display:block}
.poster{background:var(--night);color:var(--night-ink);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.poster .code{font-size:28px}
.tech{display:flex;flex-direction:column;gap:8px}
.tech ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-size:12px;font-weight:700;text-align:center}
.tile .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.tile .ti svg{width:24px;height:24px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ring{width:78px;height:78px;position:relative;display:grid;place-items:center;margin-bottom:4px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);font-weight:700}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--teal);min-height:4px}
.bars .today i{background:var(--accent)}
.bigbtn.move{background:var(--sport);color:var(--sport-ink)}
.steps{display:flex;flex-direction:column;gap:16px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.linkbtn{background:none;color:inherit;padding:0;font-size:inherit;font-weight:700;text-decoration:underline;border-radius:0}
.hello{font-size:28px;font-weight:800;letter-spacing:-.02em}
.qbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--sport);border-radius:99px}
.pickrow{display:grid!important;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;background:none!important;color:inherit!important;border-radius:0!important;padding:12px 0!important;text-align:left;font-weight:500!important}
button svg{width:18px;height:18px;flex:none}
.btn.small{padding:8px 12px;font-size:13px}
.btn.ghostlink{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
a.chip{text-decoration:none;padding:8px 12px;font-size:13px}
body.onboarding header.top, body.onboarding nav.tabs{display:none}
body.ob-dark, body.ob-dark .app{background:var(--night);color:var(--night-ink)}
.ob{display:flex;flex-direction:column;gap:14px;padding-top:calc(12px + env(safe-area-inset-top, 0px))}
.ob h1{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.ob-intro{text-align:center;min-height:calc(100vh - 60px);justify-content:space-between;gap:18px}
.ob-intro p{opacity:.85;font-size:16px;max-width:340px;margin:0 auto}
.ob-top{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-weight:800}
.ob-logo{width:30px;height:30px;display:inline-block}
.ob-skip{margin-left:auto;background:none;color:inherit;opacity:.75;padding:6px 4px;font-size:14px}
.ob-art{display:grid;place-items:center;padding:12px 0}
.ob-circle{width:210px;height:210px;border-radius:50%;display:grid;place-items:center}
.ob-circle svg{width:100px;height:100px}
.ob-dots{display:flex;gap:8px;justify-content:center}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:currentColor;opacity:.3}
.ob-dots i.on{width:26px;opacity:1;background:var(--accent)}
.ob-link{background:none;color:inherit;opacity:.8;font-weight:600}
.ob-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ob-progress i{height:5px;border-radius:99px;background:var(--line)}
.ob-progress i.on{background:var(--accent)}
.ob-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.ob-or::before,.ob-or::after{content:"";flex:1;height:1px;background:var(--line)}
.pick.sel{box-shadow:0 0 0 2px var(--accent)}
.verify{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
#map{height:300px;border-radius:14px;overflow:hidden;background:var(--sunk);z-index:0}
.leaflet-popup-content{font-family:var(--body)}
@media (prefers-reduced-motion: no-preference){.card,.hero,.bigbtn,.opt,.pick{animation:rise .3s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

function hav(a, b){ const R=6371, toR=x=>x*Math.PI/180; const dLa=toR(b[0]-a[0]), dLo=toR(b[1]-a[1]); const q=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(q)); }
const placeCoords = m => (m && typeof m.lat==="number") ? [m.lat, m.lng] : (TOWNS[m && m.town] || TOWNS.Castellanza);
const dist = m => state.here ? hav([state.here.lat, state.here.lng], placeCoords(m)) : km(myTown(), m.town);
function placeDist(m){ if (!state.here) return distLabel(m.town); const d = dist(m); return (d < 1 ? Math.max(50, Math.round(d*20)*50)+" m" : (Math.round(d*10)/10)+" km")+" · "+m.town; }
function nearestTown(lat, lng){ let best="Castellanza", bd=1e9; for (const [t,c] of Object.entries(TOWNS)) { const d = hav([lat,lng], c); if (d < bd) { bd = d; best = t; } } return {town:best, km:bd}; }
function getPos(opts){ return new Promise(res => { if (!navigator.geolocation) return res(null); try { navigator.geolocation.getCurrentPosition(p=>res(p), ()=>res(null), {enableHighAccuracy:true, timeout:12000, maximumAge:60000, ...(opts||{})}); } catch(e){ res(null); } }); }
async function locate(){ const p = await getPos(); if (!p) return null; state.here = {lat:p.coords.latitude, lng:p.coords.longitude, at:Date.now()}; try { localStorage.setItem(HERE_KEY, JSON.stringify(state.here)); } catch(e){} return nearestTown(state.here.lat, state.here.lng); }
async function nearCheck(m){ if (!m || typeof m.lat!=="number") return {ok:true, geo:false}; const p = await getPos({maximumAge:0}); if (!p) return {ok:true, geo:false}; const d = hav([p.coords.latitude, p.coords.longitude], [m.lat, m.lng]); return d <= 0.3 ? {ok:true, geo:true} : {ok:false, d}; }

const DAILY_CAP = 150;
function sessionPts(s, groupBonus){ if (!s.ok) return 0; let p = Math.round(s.min*0.5); if (s.kind==="move" && s.mode!=="venue" && !s.verified) p = Math.min(30, p); if (s.mode==="venue") p = Math.round(p*1.6); if (groupBonus) p += 10; return p; }
function groupBonusFor(pid, s){
  if (s.mode!=="group" || !s.ok || !s.group) return false;
  const g = state.groups[s.group]; if (!g) return false;
  return (g.members||[]).some(mid => mid!==pid && (state.players[mid]?.sessions||[]).some(o => o.ok && o.mode==="group" && o.group===s.group && Math.abs(o.start - s.start) < 20*60e3));
}
function stats(pid){
  const p = state.players[pid] || {}; const byDay = {}; const add = (k,v) => { byDay[k] = (byDay[k]||0) + v; };
  let focusMin = 0, weekFocus = 0, weekMove = 0, done = 0, tried = 0; const wk = new Set(weekKeys());
  for (const s of (p.sessions||[])) { const k = dkey(s.start); tried++; if (s.ok){ done++; focusMin += s.min; if (wk.has(k)) { if (s.kind==="move") weekMove++; else weekFocus += s.min; } } add(k, sessionPts(s, groupBonusFor(pid, s))); }
  const seenM = {};
  for (const c of (p.checkins||[]).slice().sort((a,b)=>a.at-b.at)) { const k = dkey(c.at); add(k, 30); const mk = k.slice(0,7); const set = seenM[mk] = seenM[mk] || new Set(); const before = set.size; set.add(c.venueId); if (before===2 && set.size===3) add(k, 60); if (wk.has(k) && ["gym","sport"].includes(state.merchants[c.venueId]?.kind)) weekMove++; }
  for (const k of Object.keys(p.free||{})) add(k, 10);
  for (const k of Object.keys(p.ritual||{})) add(k, 5);
  let earned = 0, weekPts = 0;
  for (const [k,v] of Object.entries(byDay)) { const c = Math.min(DAILY_CAP, v); earned += c; if (wk.has(k)) weekPts += c; }
  const active = Object.keys(byDay).filter(k=>byDay[k]>0).sort();
  let run = 0, prev = null, bonus = 0;
  for (const k of active){ run = (prev && dkey(addDays(new Date(prev+"T12:00"),1))===k) ? run+1 : 1; if (run%7===0){ bonus += 50; if (wk.has(k)) weekPts += 50; } prev = k; }
  let streak = 0, d = new Date(); if (!byDay[dkey(d)]) d = addDays(d,-1); while (byDay[dkey(d)]) { streak++; d = addDays(d,-1); }
  const spent = (p.coupons||[]).reduce((s,c)=>s+Number(c.cost||0),0);
  return { earned: earned+bonus, balance: earned+bonus-spent, weekPts, streak, focusMin, weekFocus, weekMove, byDay, done, tried, todayPts: Math.min(DAILY_CAP, byDay[today()]||0) };
}

function shopOffers(mid){
  const m = state.merchants[mid]; if (!m) return [];
  let list = Object.entries(m.offers||{}).filter(([,o])=>o.active).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));

  if (!isPro(mid)) list = list.filter(([,o])=>!o.flashUntil).slice(0,1);
  return list;

function shopActivities(mid){

async function finishOnboarding(){

function makePuzzle(){

    $("#pForm",ov).onsubmit = e => { e.preventDefault(); const v = ($("#pA",ov).value||"").replace(/\s/g,""); if (!v) return; if (v===cur.a) right(); else wrong("Wrong: it was "+cur.a+"."); };
    $("[data-back]",ov).onclick = close;
    const i=$("#pA",ov); if (i && !i.disabled) i.focus();
  };
  const right = () => { solved++; if (solved>=3) { close(); onUnlock(); return; } next("Correct. "+(3-solved)+" to go."); };
  const wrong = (msg) => { lives--; if (lives<=0) { unlock.lockedUntil = Date.now() + wait()*60e3; unlock.strikes++; locked(); return; } next(msg+" You lost a life."); };
  intro();
}
function checkInterrupted(){
  try { const r = JSON.parse(localStorage.getItem(SAFE_KEY)||"null"); if (!r) return; localStorage.removeItem(SAFE_KEY);
    if (Date.now() < (r.end || r.start + (r.min||0)*60e3) + 60e3) setTimeout(()=>toast("Your last session stopped because LifeOn was closed."), 800);
  } catch(e){}
}

function shopNumbers(mid){
  const m = state.merchants[mid]; const ms = monthStart(); const seenBefore = new Set(); const seenMonth = new Set();
  let checkins=0, focus=0, claimed=0;
  const firstSeen = {};
  const note = (pid, at) => { if (!(pid in firstSeen) || at < firstSeen[pid]) firstSeen[pid] = at; };
  for (const [pid,p] of Object.entries(state.players)) {
    for (const c of (p.checkins||[])) if (c.venueId===mid) { note(pid, c.at); if (c.at>=ms) { checkins++; seenMonth.add(pid); } }
    for (const s of (p.sessions||[])) if (s.mode==="venue" && s.venueId===mid && s.ok) { note(pid, s.start); if (s.start>=ms) { focus++; seenMonth.add(pid); } }
    for (const c of (p.coupons||[])) if (c.venueId===mid && c.at>=ms) claimed++;
  }
  const red = (m.redeemed||[]).filter(r=>r.at>=ms);
  for (const r of red) { note(r.player, r.at); seenMonth.add(r.player); }
  const newCustomers = [...seenMonth].filter(pid => firstSeen[pid] >= ms).length;
  const visits = checkins + focus + red.length;
  const revenue = visits * Number(m.avgTicket||0);
  const discountCost = red.reduce((s,r)=>s+Number(r.cost||0),0);
  const fees = isPro(mid) ? PRO_PRICE : red.length*FEE;
  return {checkins, focus, claimed, used:red.length, visits, newCustomers, people:seenMonth.size, revenue, discountCost, fees, net: revenue - discountCost - fees, feesIfFree: red.length*FEE};
}

    const doc = {name:$("#rName").value.trim(), kind:$("#rKind").value, town:$("#rTown").value, address:$("#rAddr").value.trim(), piva, ateco, contact:$("#rContact").value.trim(), avgTicket:Number($("#rTicket").value)||6, codeHash: await sha(code), owner:S.me, createdAt:Date.now(), offers:{}, activities:{}, redeemed:[]};
    if (await saveShop(S.me, doc)) { try { await S.setPrivate("shop", {code}); state.myCode = code; } catch(e){} toast("Registration sent. We'll check it soon."); } }; return; }
  if (!m) return;
  $$("[data-st]").forEach(b=>b.onclick=()=>{ state.shopTab=b.dataset.st; render(); });
  $$("#view [data-qr]").forEach(el => { try { if (window.QRCode) new QRCode(el, {text:el.dataset.qr, width:200, height:200, colorDark:"#13201C", colorLight:"#ffffff"}); } catch(e){} });
  const save = async upd => { const nm = clone(state.merchants[mid]); upd(nm); return saveShop(mid, nm); };
  const rot = $("#rotate"); if (rot) rot.onclick = async () => { const code = rid(5); const h = await sha(code);
    if (await save(nm => { nm.codeHash = h; })) { try { if (mine) { await S.setPrivate("shop", {code}); state.myCode = code; } else await S.save("teamkeys", mid, {code}); } catch(e){} toast("New code: "+code); render(); } };
  const vf = $("#valForm"); if (vf) vf.onsubmit = async e => {
    e.preventDefault(); const code = $("#valCode").value.trim().toUpperCase(); const out = $("#valOut");
    let hit = null; for (const [pid,p] of Object.entries(state.players)) for (const c of (p.coupons||[])) if (c.liveCode===code && c.venueId===mid) hit={pid,p,c};
    if (!hit) { out.innerHTML = `<div class="banner bad"><b>Not found.</b> Check the code, and that the coupon is for this place.</div>`; return; }
    if (couponUsed(hit.c)) { out.innerHTML = `<div class="banner warn"><b>Already used.</b></div>`; return; }
    if (hit.c.liveExp < Date.now()) { out.innerHTML = `<div class="banner warn"><b>Expired.</b> Ask the customer to tap "Show code" again.</div>`; return; }
    out.innerHTML = `<div class="banner"><b>Valid:</b> ${esc(hit.c.title)}.</div><button type="button" class="full" id="markUsed">Mark as used</button>`;
    $("#markUsed").onclick = async () => {
      const before = (m.redeemed||[]).some(r=>r.player===hit.pid) || (hit.p.checkins||[]).some(c=>c.venueId===mid) || (hit.p.sessions||[]).some(s=>s.venueId===mid);
      const off = m.offers?.[hit.c.offerKey];
      if (await save(nm => { nm.redeemed = [...(nm.redeemed||[]), {coupon:hit.c.id, player:hit.pid, at:Date.now(), offerKey:hit.c.offerKey, newCustomer:!before, cost:Number(off?.costToYou||0)}].slice(-500); }))
        out.innerHTML = `<div class="banner"><b>Done.</b> ${before?"Returning customer.":"New customer for you."}${isPro(mid)?"":" Fee: "+eur(FEE)+"."}</div>`;
    };
  };
  const fl = $("#flGo"); if (fl) fl.onclick = async () => { const [title, cy] = $("#flWhat").value.split("|");
    if (await save(nm => { nm.offers = nm.offers||{}; nm.offers["f"+rid(6)] = {title, detail:"Flash reward, valid for one hour.", tier:"small", cost:TIERS.small.cost, costToYou:Number(cy), budgetWeek:10, offPeak:false, days:[], from:"", to:"", flashUntil:Date.now()+3600e3, active:true, createdAt:Date.now()}; })) toast("Flash reward live for 1 hour"); };
  const tierBox = $("#oTier"); if (tierBox) { toggleChips(tierBox, true); $$("[data-v]", tierBox).forEach(b=>b.addEventListener("click",()=>{ const t = TIERS[b.dataset.v]; $("#tierHint").textContent = t.example; $("#oBudget").value = t.budget; })); }
  const pk = $("#oPeak"); if (pk) pk.onchange = () => { $("#peakBox").hidden = !pk.checked; };
  toggleChips($("#oDays"), false);
  const of = $("#offerForm"); if (of) of.onsubmit = async e => { e.preventDefault();
    const tier = picked($("#oTier"))[0]||"small"; const days = picked($("#oDays")).map(Number);
    if (pk.checked && !days.length) { toast("Pick at least one day"); return; }
    const o = {title:$("#oTitle").value.trim(), detail:$("#oDetail").value.trim(), tier, cost:TIERS[tier].cost, costToYou:Number($("#oCostYou").value)||0, budgetWeek:Math.max(1,Number($("#oBudget").value)||TIERS[tier].budget), offPeak:pk.checked, days:pk.checked?days:[], from:pk.checked?$("#oFrom").value:"", to:pk.checked?$("#oTo").value:"", active:true, createdAt:Date.now()};
    if (await save(nm => { nm.offers = nm.offers||{}; nm.offers["k"+rid(6)] = o; })) toast("Reward published"); };
  $$("[data-toggle]").forEach(b=>b.onclick=()=>save(nm=>{ nm.offers[b.dataset.toggle].active = !nm.offers[b.dataset.toggle].active; }));
  $$("[data-del]").forEach(b=>b.onclick=async()=>{ if (b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again"; setTimeout(()=>{ if(b.isConnected){b.dataset.armed="";b.textContent="Delete";} },3000); return; } if (await save(nm=>{ delete nm.offers[b.dataset.del]; })) toast("Deleted"); });
  const af = $("#actForm"); if (af) af.onsubmit = async e => { e.preventDefault();
    const a = {title:$("#aTitle").value.trim(), type:$("#aType").value, date:$("#aDate").value, time:$("#aTime").value, note:$("#aNote").value.trim(), deal:$("#aDeal").value.trim(), audience:$("#aAud").value, active:true, createdAt:Date.now()};
    if (a.date < today()) { toast("Pick a day from today on"); return; }
    if (await save(nm => { nm.activities = nm.activities||{}; nm.activities["a"+rid(6)] = a; })) toast("Activity published"); };
  $$("[data-delact]").forEach(b=>b.onclick=async()=>{ if (await save(nm=>{ delete nm.activities[b.dataset.delact]; })) toast("Deleted"); });
  const rp = $("#reqPro"); if (rp) rp.onclick = async () => { if (await save(nm => { nm.proRequested = Date.now(); })) toast("Request sent to the LifeOn team"); };
  const sl = $("#shopLoc"); if (sl) sl.onclick = async () => { sl.disabled = true; const p = await getPos({maximumAge:0}); if (!p) { sl.disabled = false; toast("Couldn't get your location."); return; } if (await save(nm => { nm.lat = Math.round(p.coords.latitude*1e5)/1e5; nm.lng = Math.round(p.coords.longitude*1e5)/1e5; })) toast("Location saved"); else sl.disabled = false; };
  const tf = $("#ticketForm"); if (tf) tf.onsubmit = async e => { e.preventDefault(); if (await save(nm => { nm.avgTicket = Math.max(1, Number($("#tkVal").value)||6); })) toast("Saved"); };
}

// ================= team =================
function viewTeam(){
  const t = state.teamTab; const all = Object.entries(state.merchants);
  const pending = all.filter(([mid])=>!billing(mid).status || billing(mid).status==="pending");
  const live = all.filter(([mid])=>approved(mid));
  let users=0, active=0, sessions=0, done=0, mins=0, used=0, claimed=0;
  for (const p of Object.values(state.players)) { users++; let a=false; for (const s of (p.sessions||[])) if (inThisWeek(s.start)) { sessions++; a=true; if (s.ok){ done++; mins+=s.min; } } for (const c of (p.checkins||[])) if (inThisWeek(c.at)) a=true; for (const c of (p.coupons||[])) { claimed++; if (couponUsed(c)) used++; } if (a) active++; }
  const fees = live.reduce((s,[mid])=> s + (isPro(mid) ? PRO_PRICE : ((state.merchants[mid].redeemed||[]).filter(r=>r.at>=monthStart()).length*FEE)), 0);
  const tabsH = `<div class="seg" role="group" aria-label="Team">${[["apps","Requests"+(pending.length?" ("+pending.length+")":"")],["places","Places"],["pilot","Pilot"]].map(([k,l])=>`<button type="button" data-tt="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (t==="apps") body = pending.length ? pending.map(([mid,m])=>`<section class="card"><div class="row between"><h3>${esc(m.name)}</h3><span class="chip">${esc(KIND[m.kind]||"")}</span></div>
      <p class="small muted">${esc(m.address||"")}, ${esc(m.town)} · ${esc(m.contact||"")}</p>
      <div class="grid2"><div class="stat"><span class="k">VAT number</span><span style="font-family:var(--mono)">${esc(m.piva)}</span><span class="small" style="color:${pivaValid(m.piva)?"var(--good)":"var(--bad)"}">${pivaValid(m.piva)?"Check digit OK":"Check digit wrong"}</span></div><div class="stat"><span class="k">ATECO</span><span style="font-family:var(--mono)">${esc(m.ateco)}</span></div></div>
      <p class="small muted">Before approving, check the VAT number on the EU VIES service (ec.europa.eu/taxation_customs/vies) and that the ATECO code matches the type of business.</p>
      <div class="row"><button class="teal small" data-approve="${esc(mid)}" style="flex:1">Approve on Free</button><button class="ghost small" data-reject="${esc(mid)}" style="flex:1">Reject</button></div></section>`).join("")
    : `<section class="card"><div class="empty"><p>No registrations waiting.</p></div></section>`;
  if (t==="places") body = `<section class="card"><h3>Live places</h3>${live.length?`<div class="list">${live.map(([mid,m])=>`<div class="row between"><div style="min-width:0"><b>${esc(m.name)}</b><div class="small muted">${esc(m.town)} · ${m.owner==="team"?"managed by the team":"self-managed"}${m.example?" · Example":""}${m.proRequested&&!isPro(mid)?" · asked for Pro":""}</div></div><div class="row" style="gap:6px">${m.owner==="team"||mid===S.me?`<button class="ghost small" data-manage="${esc(mid)}">Manage</button>`:""}<button class="small ${isPro(mid)?"ghost":""}" data-plan="${esc(mid)}" style="${isPro(mid)?"":"background:var(--plum);color:var(--plum-ink)"}">${isPro(mid)?"Set Free":"Set Pro"}</button></div></div>`).join("")}</div>`:`<p class="muted small">No live places yet.</p>`}</section>
    <form class="card" id="teamPlace"><h3>Add a place for a shop</h3><p class="small muted">For shops that prefer the team to manage LifeOn for them.</p>
      <label for="tpName">Name<input id="tpName" maxlength="60" required></label>
      <div class="grid2"><label for="tpKind">Type<select id="tpKind">${Object.entries(KIND).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></label><label for="tpTown">Town<select id="tpTown">${townOptions("Castellanza")}</select></label></div>
      <div class="grid2"><label for="tpPiva">VAT number<input id="tpPiva" inputmode="numeric" maxlength="11"></label><label for="tpAteco">ATECO<input id="tpAteco" maxlength="8"></label></div>
      <button class="full" type="submit">Add and approve</button></form>
    ${live.length?"":`<button class="ghost small" id="addExamples" style="align-self:flex-start">Add 3 example places for a demo</button>`}`;
  if (t==="pilot") body = `<section class="card"><h2>Pilot this week</h2><div class="grid2">
      <div class="stat"><span class="n">${active}/${users}</span><span class="k">active / joined</span></div>
      <div class="stat"><span class="n">${done}/${sessions}</span><span class="k">sessions completed</span></div>
      <div class="stat"><span class="n">${fmtMin(mins)}</span><span class="k">time won back</span></div>
      <div class="stat"><span class="n">${used}/${claimed}</span><span class="k">coupons used / claimed (all time)</span></div>
      <div class="stat"><span class="n">${live.length}</span><span class="k">live places (${live.filter(([mid])=>isPro(mid)).length} Pro)</span></div>
      <div class="stat"><span class="n">${eur(fees)}</span><span class="k">LifeOn revenue this month</span></div></div></section>
    <section class="card"><h3>By profile</h3><div class="list">${Object.entries(PROFILES).map(([k,v])=>`<div class="row between"><span>${esc(v.label)}</span><b>${Object.values(state.players).filter(p=>p.profile===k).length}</b></div>`).join("")}</div></section>`;
  return `<section class="card" style="background:var(--night);color:var(--night-ink)"><h2>LifeOn team</h2><p class="small" style="opacity:.85">Approve shops, manage plans and follow the pilot.</p></section>${tabsH}${body}`;
}
async function addTeamPlace(d, offers, activities, plan){
  const mid = "t"+rid(7), code = rid(5);
  await S.save("merchants", mid, {name:d.name, kind:d.kind, town:d.town, address:d.address||"", piva:d.piva||"", ateco:d.ateco||"", contact:"team", avgTicket:d.avgTicket||6, codeHash: await sha(code), owner:"team", example:!!d.example, createdAt:Date.now(), offers:offers||{}, activities:activities||{}, redeemed:[]});
  await S.save("teamkeys", mid, {code});
  await S.save("billing", mid, {status:"approved", plan:plan||"free", since:Date.now()});
  return mid;
}
function bindTeam(){
  $$("[data-tt]").forEach(b=>b.onclick=()=>{ state.teamTab=b.dataset.tt; render(); });
  $$("[data-approve]").forEach(b=>b.onclick=async()=>{ try { await S.save("billing", b.dataset.approve, {status:"approved", plan:"free", since:Date.now()}); toast("Approved"); } catch(e){ toast("Couldn't approve."); } });
  $$("[data-reject]").forEach(b=>b.onclick=async()=>{ if (b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again"; return; } try { await S.save("billing", b.dataset.reject, {status:"rejected", plan:"free", note:"Details could not be verified."}); toast("Rejected"); } catch(e){ toast("Couldn't update."); } });
  $$("[data-plan]").forEach(b=>b.onclick=async()=>{ const mid = b.dataset.plan; const cur = billing(mid); try { await S.save("billing", mid, {...cur, status:"approved", plan: isPro(mid) ? "free" : "pro", since:Date.now()}); toast(isPro(mid)?"Set to Free":"Pro activated"); } catch(e){ toast("Couldn't update."); } });
  $$("[data-manage]").forEach(b=>b.onclick=()=>{ state.shopMid = b.dataset.manage; state.shopTab = "results"; go("shop"); });
  const tp = $("#teamPlace"); if (tp) tp.onsubmit = async e => { e.preventDefault(); try { await addTeamPlace({name:$("#tpName").value.trim(), kind:$("#tpKind").value, town:$("#tpTown").value, piva:$("#tpPiva").value.trim(), ateco:$("#tpAteco").value.trim()}); toast("Place added. Open Manage to get its code."); } catch(err){ toast("Couldn't add the place."); } };
  const ex = $("#addExamples"); if (ex) ex.onclick = async () => { ex.disabled = true; const now = Date.now(); const day = k => dkey(now + k*864e5);
    try {
      await addTeamPlace({name:"Example café", kind:"cafe", town:"Castellanza", example:true}, {k1:{title:"Biscuit with your coffee", tier:"small", cost:100, costToYou:0.3, budgetWeek:20, offPeak:true, days:[0,1,2,3,4], from:"14:00", to:"18:00", active:true, createdAt:now}, k2:{title:"−30% on breakfast", tier:"discount", cost:300, costToYou:1.5, budgetWeek:10, offPeak:true, days:[0,1,2,3,4], from:"09:30", to:"11:30", active:true, createdAt:now+1}}, {a1:{title:"Latte art workshop", type:"workshop", date:day(3), time:"18:30", note:"Max 8 people.", deal:"−20% for LifeOn users", audience:"all", active:true}}, "pro");
      await addTeamPlace({name:"Example gym", kind:"gym", town:"Legnano", example:true}, {k1:{title:"Free trial class", tier:"reward", cost:800, costToYou:0, budgetWeek:3, offPeak:true, days:[0,1,2,3,4], from:"10:00", to:"16:00", active:true, createdAt:now}}, {a1:{title:"Yoga in the park", type:"sport", date:day(4), time:"10:00", note:"Beginners welcome.", deal:"First session free with LifeOn", audience:"all", active:true}}, "free");
      await addTeamPlace({name:"Example study café", kind:"library", town:"Busto Arsizio", example:true}, {k1:{title:"2 hours study table + drink", tier:"discount", cost:300, costToYou:1.2, budgetWeek:10, offPeak:false, days:[], from:"", to:"", active:true, createdAt:now}}, {a1:{title:"Silent study room, exam week", type:"study", date:day(1), time:"14:00", note:"Phones in a box at the door.", deal:"Table reserved for LifeOn users", audience:"study", active:true}}, "pro");
      toast("Example places added");
    } catch(e){ toast("Couldn't add examples."); ex.disabled = false; } };
}

// ================= boot =================
let gen = 0;
function boot(store){
  S = store; const my = ++gen; state.here = loadHere();
  COLS.forEach(c => { state[c] = {}; state.ready[c] = false; }); state.live = []; state.myCode = null;
  COLS.forEach(c => S.on(c, m => { if (my!==gen) return; state[c] = m; state.ready[c] = true; if (!$(".flow")) render(); }));
  S.onLive(peers => { if (my!==gen) return; state.live = peers; if (!$(".flow") && (route()==="today"||route()==="friends")) render(); });
  S.getPrivate("shop").then(d => { if (my!==gen) return; state.myCode = d?.code || null; if (!$(".flow") && route()==="shop") render(); });
  if (route()==="shop" && !state.shopMid) state.shopMid = S.me;
  render();
}
checkInterrupted();
makeDemo().then(d => { if (!S || S.demo) boot(d); });
makeLive().then(live => { if (live) boot(live); });
})();
</script>
<div id="installSheet" hidden style="position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:50;max-width:436px;margin:0 auto;background:#0E2B26;color:#EAF4F1;border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);font-family:Figtree,system-ui,sans-serif">
  <div style="display:flex;gap:12px;align-items:flex-start">
    <img src="icons/icon-192.png" alt="" width="48" height="48" style="border-radius:12px;flex:none">
    <div style="flex:1;min-width:0"><b style="font-size:16px">Install LifeOn on your phone</b><div id="installText" style="font-size:14px;opacity:.9;margin-top:4px"></div></div>
    <button id="installClose" aria-label="Close" style="background:none;color:inherit;border:0;font-size:20px;padding:0 4px;cursor:pointer">✕</button>
  </div>
  <button id="installBtn" hidden style="margin-top:12px;width:100%;border:0;border-radius:999px;padding:12px;font:700 15px Figtree,sans-serif;background:#EE5A2F;color:#fff;cursor:pointer">Install</button>
</div>
<script>
// Install helper: shown only in the browser, never inside the installed app
(function(){
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var off = false; try { off = localStorage.getItem("lifeon-install-off") === "1"; } catch(e){}
  if (standalone || off) return;
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /Instagram|FBAN|FBAV|Line|WhatsApp|Telegram/i.test(ua);
  var sheet = document.getElementById("installSheet"), text = document.getElementById("installText"), btn = document.getElementById("installBtn");
  var share = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  if (inApp) text.innerHTML = "Open this link in Safari (iPhone) or Chrome (Android) to install it.";
  else if (ios) text.innerHTML = "Tap " + share + " <b>Share</b> at the bottom of Safari, scroll down and choose <b>Add to Home Screen</b>.";
  else text.innerHTML = "Tap the browser menu <b>⋮</b> and choose <b>Install app</b> or <b>Add to Home screen</b>.";
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; btn.hidden = false; text.innerHTML = "One tap and it's on your home screen, like a normal app."; sheet.hidden = false; });
  btn.onclick = function(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ sheet.hidden = true; deferred = null; }); };
  document.getElementById("installClose").onclick = function(){ sheet.hidden = true; try { localStorage.setItem("lifeon-install-off", "1"); } catch(e){} };
  window.addEventListener("appinstalled", function(){ sheet.hidden = true; });
  setTimeout(function(){ sheet.hidden = false; }, 1200);
})();
</script>
